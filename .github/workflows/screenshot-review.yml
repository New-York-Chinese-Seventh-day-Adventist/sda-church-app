name: Screenshot review

# A person looks at a release's screenshots before it merges into main (#331).
# The iOS PR preview captures the key screens in test/screens/screens.json and
# fails on a crash, a blank screen, or text under the status bar. Other layout
# problems, such as a cut-off label or a verse number split across two lines,
# need a person. After checking the screenshots, a reviewer adds the
# "screenshots reviewed" label; a new push removes it, so every version of the
# release gets its own review. docs/operations/native-builds.md explains how.
on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

jobs:
  review:
    # Only the release PR into main; others can't merge there anyway.
    if: >-
      startsWith(github.head_ref, 'release/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Screenshots reviewed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Only to remove the label after a new push. The job never checks out or
      # runs the pull request's code.
      pull-requests: write
    steps:
      - name: Require a review of this version's screenshots
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          REVIEWED: ${{ contains(github.event.pull_request.labels.*.name, 'screenshots reviewed') }}
        run: |
          set -euo pipefail
          if [ "$ACTION" = synchronize ] && [ "$REVIEWED" = true ]; then
            gh api -X DELETE "repos/$REPO/issues/$PR/labels/screenshots%20reviewed" >/dev/null
            echo "::error::New commits need a new review: check the iOS PR preview's screenshots for this commit, then add the \"screenshots reviewed\" label again."
            exit 1
          fi
          if [ "$REVIEWED" != true ]; then
            echo "::error::Check the iOS PR preview's screenshots for this commit (the Apple Silicon run's artifact, screens/ folder), then add the \"screenshots reviewed\" label."
            exit 1
          fi
          echo 'A reviewer checked the screenshots for this commit.'
