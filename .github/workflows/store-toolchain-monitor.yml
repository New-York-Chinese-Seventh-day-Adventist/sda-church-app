name: Store Toolchain Monitor

# Google Play and App Store Connect raise their minimum Android target API and
# Xcode/iOS SDK requirements about once a year. This reads the official
# requirement pages weekly and opens an alert issue when the app falls behind,
# a new requirement starts within 120 days, or a page can no longer be read.

on:
  schedule:
    # Mondays, away from the top of the hour, when scheduled Actions are busiest.
    - cron: "23 16 * * 1"
      timezone: "America/New_York"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: store-toolchain-monitor
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ALERT_TITLE: "[monitor] Store toolchain requirements need attention"
  # Applied only when the app misses a store requirement, not when a page just
  # can't be read, so the label keeps meaning "uploads will be rejected".
  CRITICAL_LABEL: "critical / launch blocking"

jobs:
  check-store-toolchain:
    # Forks commonly disable Issues, while this monitor opens and updates an
    # alert issue. Keep scheduled/manual monitoring scoped to the canonical repo.
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Check store toolchain requirements
        id: toolchain-check
        continue-on-error: true
        run: node scripts/check-store-toolchain.cjs --report store-toolchain-report.json

      - name: Open or update the alert issue
        if: steps.toolchain-check.outcome == 'failure'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          # Comma-separated GitHub usernames. Assigning the alert sends them a
          # notification even when they don't watch the repository.
          ALERT_ASSIGNEES: ${{ vars.MONITOR_ALERT_ASSIGNEES }}
        with:
          script: |
            const fs = require('node:fs');
            const assignees = (process.env.ALERT_ASSIGNEES || '')
              .split(',')
              .map((login) => login.trim().replace(/^@/, ''))
              .filter(Boolean);
            const title = process.env.ALERT_TITLE;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let report = '- The monitor exited before producing a readable report.';
            let critical = false;
            try {
              const result = JSON.parse(fs.readFileSync('store-toolchain-report.json', 'utf8'));
              report = result.markdown;
              critical = result.checks.some((check) => check.kind === 'requirement');
            } catch (error) {
              core.warning(`Could not read the toolchain report: ${error.message}`);
            }
            const body = [
              // Without configured assignees, mention the run's actor so the
              // alert still reaches someone.
              ...(assignees.length ? [] : [`@${context.actor}`, '']),
              'The weekly store toolchain check needs attention. Google Play or App Store Connect uploads may be rejected if the Android target API or Xcode version is not updated.',
              '',
              report,
              '',
              'See **Store toolchain requirements** in `docs/operations/admin-runbook.md` for what to update and test.',
              '',
              `Run: ${runUrl}`,
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const labels = critical ? [process.env.CRITICAL_LABEL] : [];
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              // An alert that started as an unreadable page can turn into a
              // real shortfall; never remove a label a person added.
              if (labels.length) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  labels,
                });
              }
            } else {
              try {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels,
                  assignees,
                });
              } catch (error) {
                // An assignee without repository access makes the whole request
                // fail; never lose the alert over it.
                core.warning(`Could not assign ${assignees.join(', ')}: ${error.message}`);
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body: [`@${context.actor}`, '', body].join('\n'),
                  labels,
                });
              }
            }

      - name: Close the alert issue after recovery
        if: steps.toolchain-check.outcome == 'success'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const title = process.env.ALERT_TITLE;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Requirements met again in ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }

      - name: Mark the workflow unhealthy
        if: steps.toolchain-check.outcome == 'failure'
        run: |
          echo "The store toolchain check needs attention. See the job summary and alert issue."
          exit 1
